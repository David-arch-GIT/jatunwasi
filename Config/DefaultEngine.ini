[ConsoleVariables]
; --- Optimizacion Quest 2 (2026-08-31): CALIDAD RESTAURADA. El ahorro real viene de quitar las 105 luces dinamicas (CPU), no de recortar GPU ---
; Foveated Rendering dinamico (periferia liviana; el centro que miras queda nitido) - casi gratis
; Nivel 2 (2026-09-02): bajado de 3 a 2 -> el nivel 3 causaba ruido/parpadeo tipo "tele sin senal" en la periferia
; al mover la cabeza en la plaza. Nivel 2 mantiene buen ahorro de GPU pero con periferia mucho mas limpia.
xr.OpenXRFBFoveationLevel=2
; ANTI-ALIASING MSAA 4x (2026-09-02): faltaba la cuenta de muestras -> el foliaje/bordes titilaban (shimmer "de nieve").
; 4x es el estandar crudo y nitido para Quest en forward+MSAA (sin ghosting temporal). Clave contra el parpadeo de la plaza.
r.MobileMSAA=4
; Dinamico=1 (2026-09-03): ANTI-CUELGUE. Baja la carga de GPU AUTOMATICAMENTE cuando el visor se estresa
; (plaza + casting) -> degrada un poquito la periferia en vez de COLGARSE. Es el mecanismo clave para que nunca
; sature al transmitir. Cap en nivel 2 (arriba) para no traer de vuelta el "tele sin senal".
xr.OpenXRFBFoveationDynamic=1
; PSO PRECACHING MODERNO (2026-09-02, metodo recomendado UE5.3+): precompila los shaders en 2do plano (async)
; y el ajuste CLAVE ProxyCreationWhenPSOReady=1 hace que un objeto NO se dibuje hasta que su shader este listo
; -> en vez de CONGELARSE compilando, el objeto simplemente aparece cuando esta listo (SIN bloqueo, SIN freeze).
; Es lo que hace que juegos como RE4 no se cuelguen. Sin CreateShadersOnLoad (eso causaba el deadlock de build14).
r.PSOPrecaching=1
r.PSOPrecache.ProxyCreationWhenPSOReady=1
r.PSOPrecache.Components=1
r.PSOPrecache.Resources=1
; RESOLUCION DE RENDER (2026-09-03): bajada 0.8 -> 0.7 para MAS margen de GPU (anti-cuelgue al transmitir).
; Queda algo mas suave pero da el aire que el casting necesita para no saturar. Sube FPS -> menos cuelgue.
vr.PixelDensity=0.7
; LOD por distancia (2026-09-02): bajado de 2.0 a 1.25 -> 2.0 era muy agresivo y hacia que las cosas "saltaran"
; (pop de LOD) al avanzar en la plaza. 1.25 mantiene los lejanos livianos pero con transiciones mucho menos bruscas.
r.StaticMeshLODDistanceScale=1.25
; Streaming de texturas: pool acorde a Quest para evitar thrash / "sin texturas"
r.Streaming.PoolSize=1200
r.Streaming.LimitPoolSizeToVRAM=1
; ANTI-CUELGUE (2026-09-03): matar features de sky carisimas en Quest 2 forward. Las nubes volumetricas y la niebla
; volumetrica se raymarchean cada frame (muy caro) y de noche casi no aportan -> apagadas globalmente.
r.VolumetricCloud=0
r.VolumetricFog=0
